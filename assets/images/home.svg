<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title Section -->
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle" letter-spacing="1">
    Back End Developer
  </text>

  <!-- ========================================== -->
  <!-- LEFT SECTION: DESK & CODING                   -->
  <!-- ========================================== -->
  <g transform="translate(80, 120)">
    <!-- Desk Base -->
    <rect x="0" y="280" width="220" height="15" rx="4" fill="#475569" />
    <rect x="30" y="295" width="10" height="40" fill="#475569" />
    <rect x="180" y="295" width="10" height="40" fill="#475569" />

    <!-- Monitor Stand -->
    <rect x="80" y="240" width="60" height="40" rx="4" fill="#94a3b8" />
    <path d="M50 280 L 170 280 L 160 240 L 60 240 Z" fill="#64748b" />

    <!-- Monitor Screen -->
    <rect x="40" y="60" width="140" height="180" rx="10" fill="url(#screenGradient)" filter="url(#shadow)" />
    <!-- Screen Inner Border -->
    <rect x="50" y="70" width="120" height="160" rx="6" fill="none" stroke="#334155" stroke-width="2" />

    <!-- Code Lines on Screen (Green) -->
    <rect x="60" y="85" width="40" height="6" rx="2" fill="#4ade80" opacity="0.8" />
    <rect x="60" y="100" width="80" height="6" rx="2" fill="#4ade80" opacity="0.6" />
    <rect x="70" y="115" width="60" height="6" rx="2" fill="#4ade80" opacity="0.7" />
    <rect x="60" y="130" width="100" height="6" rx="2" fill="#4ade80" opacity="0.5" />
    <rect x="70" y="145" width="50" height="6" rx="2" fill="#4ade80" opacity="0.8" />
    <rect x="60" y="160" width="80" height="6" rx="2" fill="#4ade80" opacity="0.6" />
    <rect x="60" y="175" width="40" height="6" rx="2" fill="#4ade80" opacity="0.9" />
    <rect x="70" y="190" width="70" height="6" rx="2" fill="#4ade80" opacity="0.7" />
    <rect x="60" y="205" width="90" height="6" rx="2" fill="#4ade80" opacity="0.5" />

    <!-- Floating Code Tags (Left) -->
    <rect x="20" y="20" width="60" height="25" rx="6" fill="#fef08a" />
    <text x="50" y="37" font-family="Arial" font-size="12" font-weight="bold" fill="#ca8a04" text-anchor="middle">HTML</text>
    
    <rect x="150" y="220" width="50" height="25" rx="6" fill="#bfdbfe" />
    <text x="175" y="237" font-family="Arial" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">CSS</text>

    <!-- Sitting Developer (Person) -->
    <g transform="translate(80, 180)">
      <!-- Body -->
      <circle cx="30" cy="10" r="12" fill="#fca5a5" /> <!-- Head -->
      <path d="M15 25 Q 30 40, 45 25 L 40 60 L 20 60 Z" fill="#3b82f6" /> <!-- Shirt -->
      <path d="M20 60 L 25 90 L 35 90 L 40 60 Z" fill="#1e293b" /> <!-- Legs -->
      <path d="M15 25 L 5 35 L 15 45" fill="none" stroke="#fca5a5" stroke-width="4" stroke-linecap="round" /> <!-- Arm (Left) -->
      <path d="M45 25 L 55 35 L 45 45" fill="none" stroke="#fca5a5" stroke-width="4" stroke-linecap="round" /> <!-- Arm (Right) -->
      <!-- Chair -->
      <rect x="10" y="50" width="40" height="5" rx="2" fill="#475569" />
      <rect x="0" y="55" width="60" height="5" rx="2" fill="#475569" />
      <rect x="28" y="55" width="4" height="30" fill="#475569" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT SECTION: DEVELOPER WITH WRENCH       -->
  <!-- ========================================== -->
  <g transform="translate(400, 150)">
    <!-- Gears (Background) -->
    <g fill="#60a5fa" opacity="0.8">
      <!-- Gear 1 -->
      <path d="M60 80 A 25 25 0 1 1 60 30 A 25 25 0 1 1 60 80 Z" />
      <path d="M60 60 A 5 5 0 1 1 60 50 A 5 5 0 1 1 60 60 Z" fill="#f8fafc" />
      <!-- Gear 2 -->
      <path d="M120 50 A 15 15 0 1 1 120 20 A 15 15 0 1 1 120 50 Z" />
      <path d="M120 40 A 3 3 0 1 1 120 34 A 3 3 0 1 1 120 40 Z" fill="#f8fafc" />
    </g>

    <!-- Standing Developer -->
    <g transform="translate(80, 80)">
      <!-- Head -->
      <circle cx="20" cy="10" r="15" fill="#fca5a5" />
      <!-- Body -->
      <path d="M5 30 L 35 30 L 30 80 L 10 80 Z" fill="#ef4444" />
      <!-- Legs -->
      <path d="M10 80 L 15 120 L 5 120 Z" fill="#1e293b" /> <!-- Left Leg -->
      <path d="M30 80 L 35 120 L 25 120 Z" fill="#1e293b" /> <!-- Right Leg -->
      <!-- Arms holding wrench -->
      <path d="M35 35 L 60 20 L 75 40" fill="none" stroke="#fca5a5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /> <!-- Arm -->
      <!-- Wrench -->
      <g transform="translate(70, 20) rotate(-45)">
        <rect x="0" y="0" width="60" height="10" rx="2" fill="#94a3b8" /> <!-- Handle -->
        <circle cx="60" cy="5" r="15" fill="none" stroke="#94a3b8" stroke-width="8" /> <!-- Head -->
        <rect x="60" y="-10" width="15" height="30" rx="2" fill="#94a3b8" /> <!-- Grip -->
      </g>
    </g>

    <!-- Monitor Display (Right) -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="120" height="80" rx="6" fill="url(#screenGradient)" filter="url(#shadow)" />
      <!-- Code lines (Blue) -->
      <rect x="10" y="15" width="40" height="4" rx="2" fill="#60a5fa" />
      <rect x="10" y="25" width="80" height="4" rx="2" fill="#60a5fa" opacity="0.7" />
      <rect x="20" y="35" width="50" height="4" rx="2" fill="#60a5fa" opacity="0.9" />
      <rect x="10" y="45" width="100" height="4" rx="2" fill="#60a5fa" opacity="0.6" />
      <rect x="20" y="55" width="70" height="4" rx="2" fill="#60a5fa" opacity="0.8" />
      <rect x="10" y="65" width="30" height="4" rx="2" fill="#60a5fa" />
      <!-- Floating JS Tag -->
      <rect x="90" y="10" width="40" height="25" rx="6" fill="#fef08a" />
      <text x="110" y="28" font-family="Arial" font-size="12" font-weight="bold" fill="#ca8a04" text-anchor="middle">JS</text>
      <!-- Floating Code Icon -->
      <rect x="130" y="50" width="40" height="25" rx="6" fill="#bfdbfe" />
      <text x="150" y="68" font-family="Arial" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">&lt;/&gt;</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- DECORATIVE ELEMENTS (Leaves, etc.)         -->
  <!-- ========================================== -->
  <g fill="#22c55e" opacity="0.9">
    <!-- Leaf 1 (Bottom Left) -->
    <path d="M120 520 Q 150 450, 200 480 Q 180 520, 120 520 Z" />
    <path d="M150 480 L 160 460" stroke="#16a34a" stroke-width="3" fill="none" />
    
    <!-- Leaf 2 (Bottom Right) -->
    <path d="M700 500 Q 650 420, 600 460 Q 630 500, 700 500 Z" />
    <path d="M650 460 L 630 430" stroke="#16a34a" stroke-width="3" fill="none" />
  </g>

  <!-- Floating Tech Tags (Center decorations) -->
  <g transform="translate(0, 0)">
    <rect x="350" y="280" width="60" height="25" rx="6" fill="#dbeafe" />
    <text x="380" y="297" font-family="Arial" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">API</text>
    <rect x="430" y="320" width="70" height="25" rx="6" fill="#fef08a" />
    <text x="465" y="337" font-family="Arial" font-size="12" font-weight="bold" fill="#ca8a04" text-anchor="middle">SQL</text>
  </g>

  <!-- Bottom Ground/Platform Line -->
  <path d="M50 520 Q 400 480, 750 520 L 750 540 Q 400 500, 50 540 Z" fill="#3b82f6" opacity="0.8" />

</svg>
